name: Validate Sitemaps

on:
  push:
    branches:
      - main
    paths:
      - 'sitemap.xml'
      - 'sitemap_index.xml'
      - 'robots.txt'
      - '_headers'
      - '.github/workflows/submit-sitemap.yml'
  pull_request:
    paths:
      - 'sitemap.xml'
      - 'sitemap_index.xml'
      - 'robots.txt'
      - '_headers'
      - '.github/workflows/submit-sitemap.yml'
  workflow_dispatch:

jobs:
  validate-sitemaps:
    name: Validate sitemap files
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install XML tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-utils

      - name: Validate XML sitemap and sitemap index
        run: |
          xmllint --noout sitemap.xml
          xmllint --noout sitemap_index.xml

      - name: Confirm sitemap index points to sitemap.xml
        run: |
          grep -Fq '<loc>https://curative.asia/sitemap.xml</loc>' sitemap_index.xml

      - name: Confirm robots.txt references XML sitemaps
        run: |
          grep -Fxq 'Sitemap: https://curative.asia/sitemap_index.xml' robots.txt
          grep -Fxq 'Sitemap: https://curative.asia/sitemap.xml' robots.txt

      - name: Check live XML sitemap response
        if: github.event_name != 'pull_request'
        run: |
          headers="$(mktemp)"
          body="$(mktemp)"
          status="$(curl --silent --show-error --location --user-agent 'Googlebot/2.1 (+http://www.google.com/bot.html)' --dump-header "$headers" --output "$body" --write-out '%{http_code}' https://curative.asia/sitemap.xml)"

          test "$status" = "200"
          grep -iEq '^content-type: (application|text)/xml([;[:space:]]|$)' "$headers"
          xmllint --noout "$body"

      - name: Check live sitemap index response
        if: github.event_name != 'pull_request'
        run: |
          headers="$(mktemp)"
          body="$(mktemp)"
          status="$(curl --silent --show-error --location --user-agent 'Googlebot/2.1 (+http://www.google.com/bot.html)' --dump-header "$headers" --output "$body" --write-out '%{http_code}' https://curative.asia/sitemap_index.xml)"

          test "$status" = "200"
          grep -iEq '^content-type: (application|text)/xml([;[:space:]]|$)' "$headers"
          xmllint --noout "$body"

      - name: Check live robots.txt response
        if: github.event_name != 'pull_request'
        run: |
          robots="$(curl --silent --show-error --fail --location --user-agent 'Googlebot/2.1 (+http://www.google.com/bot.html)' https://curative.asia/robots.txt)"
          grep -Fq 'Sitemap: https://curative.asia/sitemap_index.xml' <<< "$robots"
          grep -Fq 'Sitemap: https://curative.asia/sitemap.xml' <<< "$robots"
